plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.t3tools.tailnet'
version = '0.1.0'
def architectures = (findProperty('reactNativeArchitectures') ?: 'arm64-v8a,armeabi-v7a,x86_64,x86').split(',')
def jniDir = layout.buildDirectory.dir('generated/tailnet').get().asFile

android {
  namespace 'expo.modules.t3tailnet'
  ndkVersion rootProject.ext.ndkVersion
  defaultConfig {
    minSdkVersion rootProject.ext.minSdkVersion
    ndk { abiFilters(*architectures) }
    externalNativeBuild { cmake { arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON', "-DTAILNET_JNI_DIR=${jniDir}" } }
  }
  sourceSets.main.jniLibs.srcDir(jniDir)
  externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }
}

dependencies {
  implementation 'com.facebook.react:react-android'
}

// The Go library must both satisfy the JNI linker and ship as an APK native library.
architectures.each { abi ->
  def gateway = tasks.register("buildGoGateway${abi.replaceAll(/[^A-Za-z0-9]/, '')}", Exec) {
    inputs.files(fileTree('../native') { include '*.go', 'go.mod', 'go.sum' }, '../build-android.sh')
    outputs.file(new File(jniDir, "${abi}/libtailnet_go.so"))
    doFirst { environment 'ANDROID_NDK_HOME', android.ndkDirectory }
    commandLine file('../build-android.sh'), abi, new File(jniDir, abi)
  }
  tasks.named('preBuild').configure { dependsOn gateway }
  tasks.configureEach {
    if (name.startsWith('configureCMake') && name.endsWith("[${abi}]")) dependsOn gateway
  }
}
