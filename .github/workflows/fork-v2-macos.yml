name: Fork V2 macOS Chinese client

on:
  workflow_dispatch:
  push:
    branches: [v2-i18n]

permissions:
  contents: read

concurrency:
  group: fork-v2-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    if: github.repository == 'Neon-Wang/t3code'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      T3CODE_DESKTOP_SIGNED: "false"
      T3CODE_DESKTOP_MOCK_UPDATES: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install dependencies
        run: vp install --frozen-lockfile --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - name: Verify locale catalogs and reactive translations
        run: vp test run packages/shared/src/i18n/index.test.ts apps/web/src/hooks/useI18n.test.tsx
      - name: Check renderer types
        run: |
          set -euo pipefail
          vp run --filter @t3tools/web --filter @t3tools/shared typecheck 2>&1 | tee "$RUNNER_TEMP/i18n-typecheck.log"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          assert.doesNotMatch(readFileSync(`${process.env.RUNNER_TEMP}/i18n-typecheck.log`, 'utf8'), /error TS\d+|\b[1-9]\d* failed\b/im);
          NODE
      - name: Align build version
        run: |
          version="0.1.0-preview.20261016.${GITHUB_RUN_NUMBER}"
          echo "BUILD_VERSION=$version" >> "$GITHUB_ENV"
          node scripts/update-release-package-versions.ts "$version"
      - name: Build unsigned arm64 DMG
        run: |
          unset GITHUB_REPOSITORY T3CODE_DESKTOP_UPDATE_REPOSITORY
          node scripts/build-desktop-artifact.ts --platform mac --target dmg --arch arm64 --build-version "$BUILD_VERSION" --verbose
      - name: Record provenance and hashes
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, readdirSync, writeFileSync } from 'node:fs';
          const files = readdirSync('release').filter(name => name.endsWith('.dmg'));
          if (files.length !== 1) throw new Error('Expected one macOS installer');
          const hashes = files.map(name => ({ name, sha256: createHash('sha256').update(readFileSync(`release/${name}`)).digest('hex') }));
          writeFileSync('release/verification.json', JSON.stringify({ version: process.env.BUILD_VERSION, commit: process.env.GITHUB_SHA, baseline: '81493efb71e8e8244f95d3e9f71d8369654ab151', platform: 'darwin-arm64', signed: false, files: hashes }, null, 2));
          writeFileSync('release/SHA256SUMS', hashes.map(({name,sha256}) => sha256 + '  ' + name + String.fromCharCode(10)).join(''));
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: t3code-v2-zh-mac-arm64
          path: |
            release/*.dmg
            release/verification.json
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
